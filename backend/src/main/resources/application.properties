# 1. Database Connection (Uses Render ENV variables - set these in Render dashboard)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scroll_web_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# 2. Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Frontend Connection (Tells the backend where to redirect users)
# Set FRONTEND_URL in Render ENV to your Vercel URL e.g. https://campus-express-three.vercel.app
frontend.url=${FRONTEND_URL:http://localhost:5173}

# 4. Google OAuth2 Configuration (NEVER hardcode these in GitHub!)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# --- Session cookie settings REMOVED ---
# The backend is now STATELESS (JWT-based). Spring Boot never creates sessions.
# The old cookie settings below were dead code from the pre-JWT era and have been cleaned up.